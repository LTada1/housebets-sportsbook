if(x=c('[data-c]')){const name=x.dataset.c;if(x.dataset.r=='football'||route=='football')return goHash(name=='All'?'football':'football/'+name);if(name=='All')return goHash(sport=='All'?'live':'live/'+sport);return goHash(sport=='All'?'live/All/'+name:'live/'+sport+'/'+name)}
if(x=c('[data-g]')){grp=x.dataset.g;$$('#main .chips button[data-g]').forEach(b=>b.classList.toggle('on',b.dataset.g==grp));const q=($('#ms')&&$('#ms').value||'').trim().toLowerCase();$$('.mk').forEach(e=>{e.style.display=(q?e.textContent.toLowerCase().includes(q):(grp=='All markets'||e.dataset.g==grp))?'':'none'});return}
if(x=c('[data-tab]')){tab=x.dataset.tab;res=null;return renderSlip()}
if(x=c('[data-sub]')){sub=x.dataset.sub;return renderSlip()}
if(x=c('[data-rm]')){slip.splice(+x.dataset.rm,1);renderSlip();return paint()}
if(x=c('[data-acc]')){const i=+x.dataset.acc;slip[i].p=P[slip[i].k];return renderSlip()}
if(x=c('[data-cash]')){const b=bets[+x.dataset.cash];b.pay=b.st*b.o*.8;b.s='cashed';bal+=b.pay;renderSlip();return paint()}
if(x=c('[data-act]')){const a=x.dataset.act;if(a=='sheet')$('#sh').classList.add('on');if(a=='close')$('#sh').classList.remove('on');if(a=='clear'){slip=[];res=null;cancelPlace();renderSlip();paint()}if(a=='place')place();if(a=='dm')tick(1);if(a=='dg')goalEvent(goalN++%2);
if(a=='dc'){const k='ars-bri|Next goal';if(!(goalBusy||goalHeld.has(k))){if(L[k]){delete L[k];S.delete(k)}else{L[k]='Closed';S.add(k)}patchSus()}}if(a=='ds'){const k='ars-bri|Next goal';if(!(goalBusy||goalHeld.has(k))){delete L[k];S.has(k)?S.delete(k):S.add(k);patchSus()}}if(a=='df'){failNext=true;renderSlip()}return}
if(x=c('[data-sr]')){const v=x.dataset.sr.split('|');if(v[0]=='c'){if(v[1]=='live'){const spn=v[2]||'All',cpn=v.slice(3).join('|')||'All';if(cpn=='All')return goHash(spn=='All'?'live':'live/'+spn);return goHash(spn=='All'?'live/All/'+cpn:'live/'+spn+'/'+cpn)}const name=v.slice(2).join('|');return goHash(!name||name=='x'?'football':'football/'+name)}if(v[0]=='p'){cur=v[1];grp='Goalscorers';msQ=v.slice(2).join('|');return goHash(['match',cur,'Goalscorers'].concat(msQ?[msQ]:[]))}if(v[0]=='m'){cur=v[1];grp=v[2]||'Popular';msQ=v.slice(3).join('|');const parts=['match',cur,grp];if(msQ)parts.push(msQ);return goHash(parts)}cur=v[1];grp='Popular';msQ='';return goHash('match/'+cur)}
if(x=c('[data-r]')){let hash=x.dataset.r;if(hash=='football'&&route=='match'&&x.closest('#main')){const mm=M.find(m=>m.id==cur);if(mm&&COMPS.includes(mm.c))hash='football/'+mm.c}if(hash=='match'){grp='Popular';msQ=''}return goHash(hash)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.i!==undefined){const i=+t.dataset.i;if(slip[i])slip[i].s=t.value;syncStake()}
if(t.id=='pq'){pageQ=t.value;applyPageQ()}
if(t.id=='ms'){msQ=t.value;const q=msQ.trim().toLowerCase();$$('.mk').forEach(e=>{e.style.display=(q?e.textContent.toLowerCase().includes(q):(grp=='All markets'||e.dataset.g==grp))?'':'none'})}if(t.id=='q'){const raw=t.value.trim(),q=raw.toLowerCase(),r=q?searchHits(q):[];
$('#hm').style.display=q?'none':'';$('#sr').innerHTML=q?(r.length?r.map(x=>`<div class="row" data-sr="${esc(x[2])}" style="cursor:pointer"><span>${esc(x[1])}</span><span class="sm">${esc(x[0])}</span></div>`).join(''):'<div class="card"><b>No results for "'+esc(raw)+'".</b><div class="sm">Try a team, player, competition or market.</div></div>'):''}});
function sigf(){return slip.map(s=>(S.has(s.k.split('|').slice(0,2).join('|'))?'S':'')+(f(s.p)!=f(P[s.k])?'C':'')).join()}
const safe=()=>{const a=document.activeElement,box=a&&['INPUT','SELECT'].includes(a.tagName)&&a.closest('.slipbox');if(!box){renderSlip();return}if(sigf()===lastSig)return;const i=a.dataset.i,c=a.selectionStart;renderSlip();const n=i!==undefined?box.querySelector('input[data-i="'+i+'"]'):box.querySelector('select[data-pref]');if(n){n.focus();try{if(c!=null)n.setSelectionRange(c,c)}catch(e){}}};
function tick(force){lastU=Date.now();M.filter(m=>m.live).forEach(m=>Object.keys(P).filter(k=>k.startsWith(m.id+'|')).forEach(k=>{const o=P[k];if(!force&&Math.random()>.2)return;P[k]=Math.max(1.05,o*(1+(Math.random()-.5)*(force?.14:.05))+((B[k]||o)-o)*.35);const b=$$('[data-k="'+k+'"]');b.forEach(e=>{e.dataset.t=P[k]>o?'up':'dn';e.classList.add(P[k]>o?'up':'dn');setTimeout(()=>e.classList.remove('up','dn'),1500)})}));paint();safe()}
setInterval(tick,9000);
function patchBoard(){M.forEach(m=>{const t=clockText(m);$$('[data-min="'+m.id+'"]').forEach(e=>{e.textContent=t});$$('[data-bar="'+m.id+'"]').forEach(e=>{e.style.width=barPct(m)+'%'});if(m.sc){$$('[data-score-h="'+m.id+'"]').forEach(e=>{e.textContent=m.sc[0]});$$('[data-score-a="'+m.id+'"]').forEach(e=>{e.textContent=m.sc[1]})}})}
function patchSus(){$$('[data-badge]').forEach(b=>{const k=b.dataset.badge,on=S.has(k);b.hidden=!on;if(on)b.textContent=L[k]||'Suspended'});paint();safe()}
let clockAt=Date.now();
function advanceClock(){const steps=Math.floor((Date.now()-clockAt)/60000);if(steps<1)return;clockAt+=steps*60000;for(let i=0;i<steps;i++)M.forEach(stepClock);patchBoard()}
setInterval(advanceClock,60000);
setInterval(()=>{if(Math.random()<.5){const k='ars-bri|Next goal';if(!L[k]&&!goalBusy&&!goalHeld.has(k)){S.has(k)?S.delete(k):S.add(k);patchSus()}}$$('.cd').forEach(e=>{const m=M.find(x=>x.id==e.dataset.id);if(m)e.textContent=cd(m)})},15000);
setInterval(()=>$$('.ut').forEach(e=>e.textContent=ago()),1000);
let goalBusy=false,goalN=0,goalToken=0;
const goalHeld=new Set();
function toast(h,ms){const t=$('#toast');t.innerHTML=h;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms)}
function typing(){const a=document.activeElement;return !!(a&&['INPUT','SELECT'].includes(a.tagName)&&a.closest('main,.slipbox,aside,#sh'))}
function goalEvent(side){if(goalBusy)return;const m=M.find(x=>x.id=='ars-bri');if(!m||!m.sc||m.phase==='ft')return;const token=++goalToken;goalBusy=true;m.sc[side]++;const team=side?m.a:m.h,keys=[],mks=new Set();
Object.values(G(m)).forEach(arr=>arr.forEach(([mk,ss])=>{mks.add(m.id+'|'+mk);ss.forEach(([sel,p])=>{const k=key(m.id,mk,sel);if(!(k in P)){P[k]=p;B[k]=p}keys.push([k,sel])})}));
goalHeld.clear();mks.forEach(k=>{if(!S.has(k))goalHeld.add(k);S.add(k)});
patchBoard();patchSus();
toast(ic('football',22)+'<div><b>GOAL! '+team+' '+m.sc[0]+'\u2013'+m.sc[1]+'</b><div class="sm" style="margin:0">'+clockText(m)+' \u00b7 Markets suspended, reopening shortly</div></div>',6500);
setTimeout(()=>{if(token!==goalToken)return;keys.forEach(([k,sel])=>{const factor=sel===team?.74:sel==='Draw'?1.25:(sel===m.h||sel===m.a)?1.38:sel==='Over'?.86:sel==='Under'?1.18:.95+Math.random()*.1;P[k]=Math.max(1.05,P[k]*factor);B[k]=Math.max(1.05,B[k]*factor)});goalHeld.forEach(k=>{if(L[k]!=='Closed')S.delete(k)});goalHeld.clear();goalBusy=false;
toast(ic('check',20)+'<div><b>Markets reopened</b><div class="sm" style="margin:0">Prices updated after the goal</div></div>',4500);
patchBoard();patchSus()},6500)}
setTimeout(()=>goalEvent(0),45000);setTimeout(()=>goalEvent(1),150000);
document.addEventListener('change',e=>{if(e.target.dataset.pref){pref=e.target.value;renderSlip()}});

keys:()=>`<h2 style="margin:0 0 10px">${ic('key',18)} House Keys</h2><p class="sm">Keys are earned on wagers at Housebets. This prototype shows sample information only. It does not calculate or promise any amount, value or conversion.</p>`,
